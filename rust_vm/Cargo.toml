[package]
name = "rust_vm"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_vm"
path = "src/main.rs"

[[bin]]
name = "rust_vm"
path = "src/main.rs"

[[bin]]
name = "rust_vm_json"
path = "src/bin/rust_vm_json.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"