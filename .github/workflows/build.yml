name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libjansson-dev python3 python3-pip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable

      - name: Build C core
        run: |
          make
          # Build object file for tests
          gcc -std=c99 -Wall -Wextra -O2 -fPIC -I. -c swuir.c -o swuir_lib.o
          gcc -std=c99 -Wall -Wextra -O2 -fPIC -I. -c swuir_vm.c -o swuir_vm.o
          # Build test executables
          gcc -std=c99 -Wall -Wextra -O2 -I. -o test_il test_il.c swuir_il.c
          gcc -std=c99 -Wall -Wextra -O2 -I. -o test_c_vm test_c_vm.c swuir_vm.o -ljansson
          gcc -std=c99 -Wall -Wextra -O2 -I. -o test_vm test_vm.c swuir_vm.o

      - name: Run C tests
        run: |
          ./swuir_poc
          ./test_il
          # Create test JSON for test_c_vm
          echo '{"version":1,"magic":"0x53575549","module":"test","bytecode":"1005000000530000000010010000005301000000520000000010010000002153000000005201000000520000000022530100000052000000001001000000344114000000520100000061ff","size":75}' > /tmp/test_c_vm.json
          ./test_c_vm /tmp/test_c_vm.json
          ./test_vm

      - name: Build Rust VM
        run: |
          source "$HOME/.cargo/env"
          cd rust_vm && cargo build --release

      - name: Run Rust VM tests
        run: |
          source "$HOME/.cargo/env"
          cd rust_vm && cargo test

      - name: Run Python VM
        run: |
          python3 python_vm.py

      - name: Cross-language bytecode tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
        run: |
          python3 cross_lang_bytecode_demo.py
          python3 test_9way.py
          python3 run_all_tests.py